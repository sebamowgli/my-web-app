<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14313A">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>월요매식회</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F6F5;--surface:#fff;--ink:#14313A;--muted:#5C7279;--line:#D5E0DE;
  --f-bg:#E3F1FA;--f:#1F6A99;--c-bg:#E4F3DC;--c:#35742A;--r-bg:#F6EBD4;--r:#8A5A12;--t-bg:#E8E6F3;--t:#4B4690;
  --warn:#B3361F;--warn-bg:#FBE4DE;--soon:#8A5A12;--soon-bg:#F6EBD4;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1C20;--surface:#172A30;--ink:#E6F0EE;--muted:#93AAB0;--line:#2A4148;
    --f-bg:#14303F;--f:#7CC4EE;--c-bg:#1C3319;--c:#9AD68A;--r-bg:#3A2E14;--r:#E5BE72;--t-bg:#26244A;--t:#B5B0F0;
    --warn:#F2907D;--warn-bg:#40201A;--soon:#E5BE72;--soon-bg:#3A2E14;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1C20;--surface:#172A30;--ink:#E6F0EE;--muted:#93AAB0;--line:#2A4148;
  --f-bg:#14303F;--f:#7CC4EE;--c-bg:#1C3319;--c:#9AD68A;--r-bg:#3A2E14;--r:#E5BE72;--t-bg:#26244A;--t:#B5B0F0;
  --warn:#F2907D;--warn-bg:#40201A;--soon:#E5BE72;--soon-bg:#3A2E14;color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:16px;line-height:1.55}
main{max-width:860px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.6rem;margin:4px 0 2px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 18px}
.tabs{display:flex;gap:4px;background:var(--line);padding:4px;border-radius:12px;margin-bottom:18px}
.tabs button{flex:1;border:0;background:transparent;color:var(--muted);font:inherit;padding:10px;border-radius:9px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--f);outline-offset:2px}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;margin-bottom:14px}
.step{display:flex;align-items:center;gap:10px}
.step button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:1.2rem;cursor:pointer}
.step b{min-width:3.2em;text-align:center;font-size:1.15rem}
.prog{flex:1;min-width:160px}
.prog small{color:var(--muted)}
.track{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:4px}
.track i{display:block;height:100%;background:var(--c);width:0;transition:width .25s}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:.9rem;padding:5px 13px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.group{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:16px;overflow:hidden}
.gh{display:flex;justify-content:space-between;align-items:baseline;padding:12px 16px}
.gh h2{margin:0;font-size:1.05rem}
.gh span{font-size:.88rem}
.g-f .gh{background:var(--f-bg);color:var(--f)}
.g-c .gh{background:var(--c-bg);color:var(--c)}
.g-r .gh{background:var(--r-bg);color:var(--r)}
.g-t .gh{background:var(--t-bg);color:var(--t)}
ul{list-style:none;margin:0;padding:0}
li.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;border-top:1px solid var(--line)}
li.row label{display:flex;align-items:center;gap:10px;flex:1;cursor:pointer;min-width:0}
li.row input[type=checkbox]{width:20px;height:20px;accent-color:var(--c)}
li.done .nm{text-decoration:line-through;color:var(--muted)}
.qty{color:var(--muted);white-space:nowrap}
.x{border:0;background:transparent;color:var(--muted);font-size:1.3rem;cursor:pointer;padding:0 6px;line-height:1}
.empty{padding:14px 16px;color:var(--muted);border-top:1px solid var(--line)}
.kind{font-size:.78rem;padding:1px 8px;border-radius:999px;background:var(--line);color:var(--muted);margin-left:8px}
.exp{font-size:.8rem;padding:1px 8px;border-radius:999px;background:var(--c-bg);color:var(--c)}
.exp.soon{background:var(--soon-bg);color:var(--soon)}
.exp.over{background:var(--warn-bg);color:var(--warn)}
.meta{display:flex;align-items:center;gap:8px}
.add{display:flex;flex-wrap:wrap;gap:8px;background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:12px}
.add input,.add select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.add .grow{flex:1 1 140px}
.add .sm{flex:0 1 100px}
.add button{font:inherit;border:0;border-radius:8px;background:var(--ink);color:var(--bg);padding:8px 16px;cursor:pointer}
.row-actions{display:flex;justify-content:flex-end;margin:-4px 0 14px}
.link{border:0;background:none;color:var(--muted);font:inherit;text-decoration:underline;cursor:pointer}
.split{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
@media (max-width:640px){.split{grid-template-columns:1fr}}
.split .g-r{grid-column:1/-1}
.search{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-bottom:12px}
[hidden]{display:none!important}
body{background-image:linear-gradient(180deg,color-mix(in srgb,var(--r-bg) 75%,var(--bg)) 0,var(--bg) 260px)}
h1,.gh h2,.tabs button,.chip,.add button{font-family:"Jua","Gowun Dodum",sans-serif;font-weight:400}
h1{font-size:2.1rem;letter-spacing:0}
.deco{font-size:1.6rem;margin:0 0 2px;display:flex;gap:10px}
.deco span{display:inline-block;animation:bob 2.4s ease-in-out infinite}
.deco span:nth-child(2){animation-delay:.2s}.deco span:nth-child(3){animation-delay:.4s}.deco span:nth-child(4){animation-delay:.6s}.deco span:nth-child(5){animation-delay:.8s}.deco span:nth-child(6){animation-delay:1s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.tabs,.tabs button{border-radius:999px}
.tabs button{font-size:1.1rem}
.chip{font-size:1rem}
.group,.add{border-radius:20px;border-width:2px}
.gh h2{font-size:1.25rem}
.add button{border-radius:999px}
li.row:hover{background:var(--bg)}
.emo{display:inline-block;width:1.7em;text-align:center;font-size:1.15rem;transition:transform .15s}
li.row:hover .emo{transform:scale(1.3) rotate(-8deg)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.kit{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px 24px;align-items:start}
.kit.one{display:block}
#fridgeLists.split{display:block}
.fridge{border:3px solid var(--ink);border-radius:28px 28px 16px 16px;background:var(--surface);padding:10px;box-shadow:0 8px 0 -3px var(--line);margin-bottom:12px}
.fridge .group{position:relative;overflow:visible;margin:0 0 10px;border-width:2px;border-radius:18px}
.fridge .group:last-child{margin-bottom:0}
.fridge .gh{border-radius:16px 16px 0 0}
.fridge .g-f{background:color-mix(in srgb,var(--f-bg) 45%,var(--surface))}
.fridge .group::after{content:"";position:absolute;top:16px;right:-20px;width:7px;height:44px;border-radius:4px;background:var(--ink)}
.side{display:flex;flex-direction:column;gap:16px}
.side .group{margin:0}
.g-t{border-width:3px;border-radius:14px}
.g-r{border-style:solid}
@media (max-width:640px){.kit{grid-template-columns:1fr}.fridge .group::after{display:none}}
.kit{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.fridge,.side{display:contents}
.fridge .group,.side .group{margin:0;border-width:2px;border-radius:20px;overflow:hidden}
.fridge .group::after{display:none}
.fridge .gh{border-radius:0}
.fridge .g-f{background:var(--surface)}
.side .group:only-child{grid-column:1/-1}
.g-t{border-width:2px;border-radius:20px}
@media (max-width:640px){.kit{grid-template-columns:1fr}}
#recipes{margin:0 0 20px}
.rh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.rh h2{font-family:"Jua","Gowun Dodum",sans-serif;font-weight:400;font-size:1.4rem;margin:0}
.rgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.rc{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:14px}
.rt{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.rt b{display:block;font-family:"Jua","Gowun Dodum",sans-serif;font-weight:400;font-size:1.15rem}
.rt small{color:var(--muted)}
.rt .exp{margin-left:auto}
.emo.big{font-size:1.9rem;width:auto}
.ing{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.ig{font-size:.82rem;padding:2px 10px;border-radius:999px;background:var(--line);color:var(--muted)}
.ig.on{background:var(--c-bg);color:var(--c)}
.ig.opt{background:transparent;border:1px dashed var(--line)}
.ig.opt.on{background:var(--c-bg);border-color:var(--c)}
.rc summary{cursor:pointer}
.rc ol{margin:8px 0 0;padding-left:1.3em;color:var(--muted)}
.rnote{color:var(--muted);font-size:.85rem;margin:10px 0 0}
.g-b .gh{background:var(--warn-bg);color:var(--warn)}
.sec{margin-top:26px}
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:640px){.pgrid{grid-template-columns:1fr}}
.own{font:inherit;font-size:.78rem;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:1px 2px;max-width:5.4em}
.padd{display:flex;gap:6px;padding:10px 12px;border-top:1px solid var(--line)}
.padd input{flex:1 1 90px;min-width:0;font:inherit;font-size:.9rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:5px 8px}
.padd .sm{flex:0 1 64px}
.gh{align-items:center;gap:6px 8px;flex-wrap:wrap}
.g-m .gh{background:color-mix(in srgb,#f2a93b 30%,var(--surface));color:var(--ink)}
.gh .padd.inl{border:0;padding:0;flex:1 1 170px;min-width:0}
.gh .padd.inl input{background:var(--surface);padding:3px 8px}
.gh .padd.inl .sm{flex:0 1 54px}
.gh .padd.inl button{padding:2px 10px}
.padd button{border:1px solid #E6B800;border-radius:999px;background:#FFE27A;color:#14313A;padding:4px 12px;cursor:pointer;font:inherit}
.padd button:hover{background:#FFD84D}
.plus{border:0;background:none;color:var(--ink);font:inherit;font-size:1.8rem;font-weight:700;line-height:1;padding:0 6px;cursor:pointer;transition:transform .12s}
.plus:hover{transform:scale(1.25)}
.g-f .plus{color:var(--f)}
.g-c .plus{color:var(--c)}
.g-r .plus{color:var(--r)}
.g-b .plus{color:var(--warn)}
.g-s .plus{color:#C2527A}
.g-m .plus{color:#B87400}
.g-t .plus{color:var(--t)}
.okbtn{border:0;background:none;color:var(--ink);font:inherit;font-size:1.8rem;font-weight:700;line-height:1;padding:0 8px;cursor:pointer;transition:transform .12s}
.okbtn:hover{transform:scale(1.25)}
.ei{display:flex;align-items:center;gap:8px}
.ei input{flex:1}
.chip[data-v="all"],.chip[data-v="t"]{background:light-dark(#E4E6E7,#33414A);color:var(--ink);border-color:light-dark(#CBD0D2,#4A5A62)}
.chip[data-v="all"][aria-pressed="true"],.chip[data-v="t"][aria-pressed="true"]{background:light-dark(#6E7679,#A9B5BA);color:light-dark(#fff,#0F1C20);border-color:light-dark(#6E7679,#A9B5BA)}
.gh .plus{margin-left:auto;order:3}
.gh>span{order:2}
.at{color:var(--muted);font-size:.72rem;white-space:nowrap}
.qe{font:inherit;font-size:.9rem;color:var(--ink);background:transparent;border:1px solid transparent;border-bottom:1px dashed var(--line);border-radius:6px;padding:2px 6px;width:5.5em;text-align:right;min-width:0}
.qe:hover,.qe:focus{background:var(--bg);border-color:var(--line)}
.dlg{position:fixed;inset:0;background:rgba(10,20,24,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.dbox{background:var(--surface);color:var(--ink);border:2px solid var(--line);border-radius:22px;padding:18px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:12px}
.dbox h2{margin:0;font-family:"Jua","Gowun Dodum",sans-serif;font-weight:400;font-size:1.3rem}
.dbox label{display:flex;flex-direction:column;gap:4px;font-size:.9rem;color:var(--muted);flex:1;min-width:0}
.dbox input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.dbox input[readonly]{opacity:.75}
.dt{display:flex;gap:10px}
.derr{margin:0;color:var(--warn);font-size:.9rem}
.dact{display:flex;justify-content:flex-end;align-items:center;gap:14px}
.who{flex-basis:100%;display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding-left:32px;margin-top:-2px}
.wl{font:inherit;font-size:.85rem;background:var(--bg);border:1px dashed var(--line);border-radius:999px;padding:2px 12px;color:var(--ink);cursor:pointer}
.wl[aria-expanded="true"]{border-style:solid;border-color:var(--f);color:var(--f)}
.wc{display:inline-flex;align-items:center;gap:4px;font-size:.85rem;padding:2px 10px 2px 6px;border-radius:999px;border:1px solid var(--line);cursor:pointer}
.wc input{width:16px;height:16px;accent-color:var(--f)}
.wc.on{background:var(--f-bg);color:var(--f);border-color:var(--f)}
.g-s .gh{background:color-mix(in srgb,#f4a6c0 35%,var(--surface));color:var(--ink)}
</style>
</head>
<body>
<main>
  <div class="deco" aria-hidden="true"><span>🍙</span><span>🥟</span><span>🍳</span><span>🥗</span><span>🍜</span><span>🍰</span></div>
  <h1>월요매식회 🥢</h1>
  <p class="sub">오늘 점심은 뭘로? 🍴 챙길 것은 쏙쏙, 냉장고 속은 한눈에!</p>
  <p class="sub" id="sync" style="margin-top:-12px;font-size:.85rem">이 기기에만 저장</p>

  <section id="prepView">
    <div class="chips" id="prepChips"></div>
    <section id="recipes"></section>
    <div id="prepList"></div>
    <div class="row-actions"><button class="link" id="resetChecks">🔄 체크 모두 해제</button></div>
  </section>

  <div id="dlg" class="dlg" hidden>
    <div class="dbox" role="dialog" aria-modal="true" aria-labelledby="dTitle">
      <h2 id="dTitle">식재료 추가</h2>
      <label><span id="dNameL">식재료 이름</span> <span class="ei"><input id="dName" placeholder="예: 삼겹살" autocomplete="off"><span id="dEmo" class="emo">🍽️</span></span></label>
      <label>수량 <input id="dQty" placeholder="예: 600g, 2개" autocomplete="off"></label>
      <div class="dt"><label>날짜 (자동) <input id="dDate" readonly></label><label>시간 (자동) <input id="dTime" readonly></label></div>
      <p class="derr" id="dErr" hidden>이름과 수량을 모두 입력해 주세요.</p>
      <div class="dact"><button type="button" class="link" id="dCancel">취소</button><button type="button" class="okbtn" id="dOk" aria-label="추가">+</button></div>
    </div>
  </div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>

function dday(e){

}
