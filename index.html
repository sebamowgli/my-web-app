}

html{scroll-padding-top:env(safe-area-inset-top,0px)}

body{margin:0;background:var(--bg);color:var(--ink);font-family:"Jua","Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:16.5px;line-height:1.5;letter-spacing:.01em}

.qty{color:var(--muted);white-space:nowrap}

body{background-image:linear-gradient(180deg,color-mix(in srgb,var(--r-bg) 75%,var(--bg)) 0,var(--bg) 260px)}

function makeBatches(arr){
  var left=arr.slice(),out=[];
  while(left.length){
    var b=[],cats={},i;
    for(i=0;i<left.length&&b.length<3;i++){var c=left[i].r[5];if(!cats[c]){cats[c]=1;b.push(i)}}
    for(i=0;i<left.length&&b.length<3;i++){if(b.indexOf(i)<0)b.push(i)}
    out.push(b.map(function(k){return left[k]}));
    left=left.filter(function(_,k){return b.indexOf(k)<0});
  }
  var last=out[out.length-1];
  if(last&&last.length<3&&arr.length>=3){
    for(var j=0;j<arr.length&&last.length<3;j++){if(last.indexOf(arr[j])<0)last.push(arr[j])}
  }
  return out;
}

function dday(e){
  if(!e)return "";
  var t=new Date();t.setHours(0,0,0,0);
  var n=Math.round((new Date(e+"T00:00:00")-t)/864e5);
  if(n<0)return '<span class="exp over">기한 '+(-n)+'일 지남</span>';
  if(n===0)return '<span class="exp over">오늘까지</span>';
  return '<span class="exp'+(n<=3?" soon":"")+'">D-'+n+'</span>';
}

function sortItems(items,mode){
  var p=(mode||"reg-desc").split("-"),dir=p[1]==="asc"?1:-1;
  var w=items.map(function(i){return{i:i,k:S.prep.indexOf(i)}});
  w.sort(function(a,b){
    var r=0;
    if(p[0]==="name")r=a.i.n.localeCompare(b.i.n,"ko");
    else if(p[0]==="exp"){
      var ea=a.i.exp||"",eb=b.i.exp||"";
      if(!ea&&!eb)r=0;else if(!ea)return 1;else if(!eb)return -1;else r=ea<eb?-1:(ea>eb?1:0);
    }else r=a.k-b.k;
    return (r*dir)||(b.k-a.k);
  });
  return w.map(function(x){return x.i});
}
